# fullerene-kernel/Cargo.toml
[package]
name = "fullerene-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autoexamples = false

[[bin]]
name = "fullerene-kernel"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "fullerene-kernel-esp32"
path = "src/arch/xtensa/esp32/main.rs"
required-features = ["esp32"]
test = false
bench = false

[[bin]]
name = "fullerene-kernel-aarch64"
path = "src/arch/aarch64/bin.rs"
required-features = ["aarch64"]
test = false
bench = false

[[bin]]
name = "fullerene-kernel-aarch64-probe"
path = "src/arch/aarch64/probe.rs"
required-features = ["aarch64"]
test = false
bench = false

[[bin]]
name = "fullerene-kernel-aarch64-entry-halt-probe"
path = "src/arch/aarch64/probe.rs"
required-features = ["aarch64"]
test = false
bench = false

[[bin]]
name = "fullerene-kernel-aarch64-usb-probe"
path = "src/arch/aarch64/usb_probe.rs"
required-features = ["aarch64"]
test = false
bench = false

# These examples are consumed by the UEFI/native smoke paths. The native_*
# entries are freestanding no_std payloads, so they are not host test
# harnesses: compiling those entries as tests enables unwinding against a
# no_std binary and fails before the payload can be checked. linux_musl_hello
# is a std-based host smoke example and is kept test-disabled for the same
# explicit-example policy.
[[example]]
name = "linux_musl_hello"
test = false
bench = false
required-features = ["native-payload"]

[[example]]
name = "native_shell"
test = false
bench = false
required-features = ["native-payload"]

[[example]]
name = "native_launchd"
test = false
bench = false
required-features = ["native-payload"]

[[example]]
name = "native_ipc_rate"
test = false
bench = false
required-features = ["native-payload"]

# The remaining files under examples/ are freestanding AArch64 payloads or
# modules embedded by build.rs. Keep them out of the host test harness: the
# payloads intentionally have no `main`, use AArch64 syscall registers, or
# provide their own panic/entry contract.
[[example]]
name = "android_aarch64_init"
test = false
bench = false
required-features = ["aarch64"]

[[example]]
name = "android_aarch64_service"
test = false
bench = false
required-features = ["aarch64"]

[[example]]
name = "linux_aarch64_smoke"
test = false
bench = false
required-features = ["aarch64"]

[[example]]
name = "native_aarch64_child"
test = false
bench = false
required-features = ["aarch64"]

[[example]]
name = "native_aarch64_launchd"
test = false
bench = false
required-features = ["aarch64"]

# The freestanding AArch64 boot binary is intentionally not a test harness,
# but the allocation-free DTB parser can be tested on the host unchanged.
[[test]]
name = "aarch64_fdt"
path = "tests/aarch64_fdt.rs"

[target.'cfg(all(not(target_arch = "aarch64"), not(target_arch = "xtensa")))'.dependencies]
x86_64 = { workspace = true, features = [
  "instructions",
  "abi_x86_interrupt",
] }
spin = { workspace = true, features = [
  "once",
  "mutex",
  "spin_mutex",
] }
fullerene-abi = { path = "abi" }
genome = { path = "../genome" }
petroleum = { path = "../petroleum" }
nitrogen = { path = "../nitrogen" }
nozzle = { path = "../nozzle" }
bonder = { path = "../bonder" }
lattice = { path = "../lattice" }
solvent = { path = "../solvent" }
resonance = { path = "../resonance" }
embedded-graphics = { workspace = true }
memoffset = { version = "0.9", default-features = false }
linked_list_allocator = { version = "0.10.6", default-features = false, features = [
  "alloc_ref",
] }
goblin = { workspace = true, features = [
  "elf32",
  "elf64",
  "endian_fd",
] }
bitfield = { version = "0.19.3", default-features = false }
static_assertions = { version = "1.1", default-features = false }
bitflags = { workspace = true, default-features = false }
volatile = { workspace = true }
pc-keyboard = { workspace = true }
heapless = { version = "0.9.2", default-features = false }
paste = "1.0.15"
log = { workspace = true }
wasi_runtime = { path = "../solvent/wasi" }
# shell-words = "1.1"  # Cannot use in no_std kernel

[target.'cfg(target_arch = "aarch64")'.dependencies]
fullerene-abi = { path = "abi" }
genome = { path = "../genome" }
spin = { workspace = true, features = ["mutex", "spin_mutex"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
fullerene-abi = { path = "abi" }
spin = { workspace = true, features = ["once", "mutex", "spin_mutex"] }
nitrogen = { path = "../nitrogen" }
genome = { path = "../genome" }
lattice = { path = "../lattice" }
solvent = { path = "../solvent" }
resonance = { path = "../resonance" }
nozzle = { path = "../nozzle" }

[build-dependencies]
busybox-build = { path = "../toluene/busybox-build" }

[features]
default = []
aarch64 = []
aarch64-user-smoke = []
aarch64-user-fault-smoke = ["aarch64-user-smoke"]
aarch64-user-launchd = []
aarch64-linux-smoke = ["aarch64-user-launchd"]
# Boot the read-only Android `/system/bin/init` through the same AArch64
# user-task boundary. The feature is intentionally opt-in because it requires
# a successful Bramble UFS/LP/filesystem mount at runtime.
aarch64-android-init = ["aarch64-user-launchd"]
esp32 = [
  "nitrogen/esp32",
  "genome/esp32",
  "lattice/esp32",
  "solvent/esp32",
  "resonance/esp32",
  "nozzle/esp32",
]
user_space = []
native-payload = []

[dev-dependencies]
petroleum = { path = "../petroleum", features = ["std"] }
