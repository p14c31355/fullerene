name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, metadata, and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview, rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Restrict linux-firmware checkout
        run: git -C bonder/iwlwifi sparse-checkout set intel/iwlwifi
      - run: cargo fmt --all --check
      - run: cargo run --locked --quiet -p fullerene-tools --bin check-dependency-duplicates
      - run: cargo run --locked --quiet -p fullerene-tools --bin generate-support-matrix -- --check

  host:
    name: Host check, tests, and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview, rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Restrict linux-firmware checkout
        run: git -C bonder/iwlwifi sparse-checkout set intel/iwlwifi
      - run: cargo check --workspace --exclude bellows --exclude fullerene-kernel
      - run: cargo test --workspace --exclude bellows --exclude fullerene-kernel
      - run: cargo clippy --workspace --exclude bellows --exclude fullerene-kernel --all-targets

  uefi:
    name: UEFI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-uefi, wasm32-wasip1, x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Restrict linux-firmware checkout
        run: git -C bonder/iwlwifi sparse-checkout set intel/iwlwifi
      - name: Build kernel
        run: cargo build -Z build-std=core,alloc --package fullerene-kernel --bin fullerene-kernel --target x86_64-unknown-uefi
      - name: Build bootloader
        env:
          KERNEL_BIN_PATH: ${{ github.workspace }}/target/x86_64-unknown-uefi/debug/fullerene-kernel.efi
        run: cargo check -Z build-std=core,alloc --package bellows --target x86_64-unknown-uefi

  aarch64:
    name: AArch64 build and QEMU smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview, rustfmt
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Install AArch64 QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-arm
      - name: Restrict linux-firmware checkout
        run: git -C bonder/iwlwifi sparse-checkout set intel/iwlwifi
      - name: Build all AArch64 entry and USB probe modes
        shell: bash
        run: |
          set -euo pipefail
          target=(cargo build -Z build-std=core,alloc --package fullerene-kernel --features aarch64 --target aarch64-unknown-none -q)
          env -u FULLERENE_AARCH64_ENTRY_HALT_PROBE \
            -u FULLERENE_AARCH64_USB_PULLUP_PROBE \
            -u FULLERENE_AARCH64_USB_HALT_PROBE \
            -u FULLERENE_AARCH64_USB_COLD_HALT_PROBE \
            -u FULLERENE_AARCH64_USB_BARE_PULLUP_PROBE \
            -u FULLERENE_AARCH64_USB_GADGET_HANDOFF_PROBE \
            "${target[@]}" --bin fullerene-kernel-aarch64
          "${target[@]}" --bin fullerene-kernel-aarch64-probe
          FULLERENE_AARCH64_ENTRY_HALT_PROBE=1 "${target[@]}" --bin fullerene-kernel-aarch64-entry-halt-probe
          for mode in \
            FULLERENE_AARCH64_USB_PULLUP_PROBE \
            FULLERENE_AARCH64_USB_HALT_PROBE \
            FULLERENE_AARCH64_USB_COLD_HALT_PROBE \
            FULLERENE_AARCH64_USB_BARE_PULLUP_PROBE \
            FULLERENE_AARCH64_USB_GADGET_HANDOFF_PROBE; do
            env "$mode=1" "${target[@]}" --bin fullerene-kernel-aarch64-usb-probe
          done
      - name: Prebuild the release artifact used by Flasks
        run: |
          CARGO_TARGET_AARCH64_UNKNOWN_NONE_LINKER=rust-lld \
          FULLERENE_AARCH64_PLATFORM=qemu-virt \
          RUSTFLAGS="-C relocation-model=pic -C link-arg=-pie -C link-arg=-z -C link-arg=notext" \
          cargo build -q --release -Z build-std=core,alloc \
            --package fullerene-kernel --features aarch64 \
            --bin fullerene-kernel-aarch64 --target aarch64-unknown-none
      - name: Boot the QEMU virt path
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout --signal=TERM 90s cargo run -q -p flasks -- run \
            --arch aarch64 --platform qemu-virt --headless 2>&1 | tee /tmp/fullerene-aarch64-qemu.log
          status=${PIPESTATUS[0]}
          set -e
          grep -q "fullerene:" /tmp/fullerene-aarch64-qemu.log
          if [[ "$status" -ne 0 && "$status" -ne 124 && "$status" -ne 143 ]]; then
            exit "$status"
          fi

  drivers:
    name: Driver tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all
            ignored: ""
          - profile: no-wireless
            ignored: "iwlwifi\nwifi"
          - profile: no-usb-storage
            ignored: "usb\nstorage"
          - profile: minimal-console
            ignored: "audio\nframebuffer\nhda\niommu\niwlwifi\nstorage\nusb\nvirtio\nwifi"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Test selected driver profile
        env:
          NITROGEN_DRIVERIGNORE: ${{ matrix.ignored }}
        run: cargo test -p nitrogen --lib
