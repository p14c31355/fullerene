[package]
name = "solvent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
esp32 = []

[target.'cfg(not(any(target_arch = "xtensa", target_arch = "aarch64")))'.dependencies]
x86_64 = { workspace = true, features = [
  "instructions",
] }
spin = { workspace = true, features = [
  "once",
  "mutex",
  "spin_mutex",
] }
bonder = { path = "../bonder" }
petroleum = { path = "../petroleum" }
nitrogen = { path = "../nitrogen" }
carrier = { path = "../carrier" }
nozzle = { path = "../nozzle" }
lattice = { path = "../lattice" }
resonance = { path = "../resonance" }
chronoline = { path = "../chronoline" }
genome = { path = "../genome" }
log = { workspace = true }

[lib]
name = "solvent"
path = "src/lib.rs"

[dev-dependencies]
petroleum = { path = "../petroleum", features = ["std"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
lattice = { path = "../lattice" }
nozzle = { path = "../nozzle" }
nitrogen = { path = "../nitrogen" }
genome = { path = "../genome" }
resonance = { path = "../resonance" }
spin = { workspace = true, features = ["once", "mutex", "spin_mutex"] }
log = { workspace = true }

# aarch64 (the ANE desktop port): mirror the xtensa set as the starting
# point; the compiler lists exactly what else the desktop path needs.
[target.'cfg(target_arch = "aarch64")'.dependencies]
lattice = { path = "../lattice" }
nozzle = { path = "../nozzle" }
nitrogen = { path = "../nitrogen" }
genome = { path = "../genome" }
resonance = { path = "../resonance" }
spin = { workspace = true, features = ["once", "mutex", "spin_mutex"] }
log = { workspace = true }
